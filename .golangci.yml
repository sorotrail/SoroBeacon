version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - unconvert
    - gocritic
    - revive
    - errorlint
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
        - fmt.Fprint
        - fmt.Fprintf
    revive:
      rules:
        - name: package-comments
          disabled: true
    errorlint:
      # Prefer errors.Is / errors.As over == and type assertions.
      errorf: true
      asserts: true
      comparison: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofumpt
