{{- /*
API_TOKEN guards every API route and the dashboard, and
CONFIG_ENCRYPTION_KEY is the key that decrypts channel config — which holds
webhook URLs, bot tokens and SMTP credentials. Both are credentials, so both
live in a Secret and are never rendered into the ConfigMap, a log line or an
error message.

The Secret is only created when at least one value is supplied inline: with
neither set, and no existingSecret, the deployment does not reference the
Secret at all.
*/ -}}
{{- if not .Values.auth.existingSecret -}}
{{- if or .Values.auth.apiToken .Values.auth.configEncryptionKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sorobeacon.authSecretName" . }}
  labels:
    {{- include "sorobeacon.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.apiToken }}
  API_TOKEN: {{ .Values.auth.apiToken | quote }}
  {{- end }}
  {{- if .Values.auth.configEncryptionKey }}
  CONFIG_ENCRYPTION_KEY: {{ .Values.auth.configEncryptionKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
