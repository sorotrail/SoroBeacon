{{- /*
API_TOKEN guards every API route and the dashboard, and
CONFIG_ENCRYPTION_KEY is the key that decrypts channel config — which holds
webhook URLs, bot tokens and SMTP credentials. Both are credentials, so both
live in a Secret and are never rendered into the ConfigMap, a log line or an
error message.

The Secret is only created when at least one value is supplied inline: with
neither set, and no existingSecret, the deployment does not reference the
Secret at all.
*/ -}}
{{- if not .Values.auth.existingSecret -}}
{{- if or .Values.auth.apiToken .Values.auth.configEncryptionKey .Values.auth.workspaceTokens .Values.oidc.clientSecret .Values.secrets.vaultToken -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sorobeacon.authSecretName" . }}
  labels:
    {{- include "sorobeacon.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.apiToken }}
  API_TOKEN: {{ .Values.auth.apiToken | quote }}
  {{- end }}
  {{- if .Values.auth.configEncryptionKey }}
  CONFIG_ENCRYPTION_KEY: {{ .Values.auth.configEncryptionKey | quote }}
  {{- end }}
  {{- /*
  Rendered unconditionally, as VAULT_TOKEN is: both are credentials that belong
  in the Secret whether or not this deployment uses them, and an empty value
  reads as unset to internal/config. Keeping them present is also what lets the
  chart claim it can set every variable the application reads.
  */}}
  WORKSPACE_TOKENS: {{ .Values.auth.workspaceTokens | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  VAULT_TOKEN: {{ .Values.secrets.vaultToken | quote }}
{{- end }}
{{- end }}
