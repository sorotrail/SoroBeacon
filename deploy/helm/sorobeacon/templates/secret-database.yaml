{{- /*
The connection string lives in a Secret rather than the ConfigMap: it usually
embeds a password, and it must never be readable by anything that can list
ConfigMaps. When database.existingSecret is set the operator owns that Secret
(External Secrets, Sealed Secrets, or a hand-created object) and the chart only
references it, so credential rotation never goes through a Helm release.
*/ -}}
{{- if not .Values.database.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sorobeacon.databaseSecretName" . }}
  labels:
    {{- include "sorobeacon.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "database.url is required unless database.existingSecret names a Secret that already holds the connection string" .Values.database.url | quote }}
{{- end }}
