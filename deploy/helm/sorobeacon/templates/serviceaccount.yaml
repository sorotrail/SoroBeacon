{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sorobeacon.serviceAccountName" . }}
  labels:
    {{- include "sorobeacon.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# SoroBeacon calls no Kubernetes API, so no Role or RoleBinding is bound here:
# the ServiceAccount exists to keep the pod off the namespace default.
automountServiceAccountToken: false
{{- end }}
