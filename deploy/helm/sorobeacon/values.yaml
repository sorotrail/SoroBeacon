# SoroBeacon Helm values.
#
# Every environment variable internal/config reads has a key here, carrying
# the same default the application itself uses when the variable is unset —
# so `helm install` with no overrides produces exactly the behaviour of
# running the binary with an empty environment (plus DATABASE_URL). The
# operator reference for what each variable does is docs/configuration.md.

# Number of API pod replicas (or combined replicas when worker.enabled is false).
#
# Workload scaling properties:
# - The JSON API, GraphQL endpoint, and web dashboard are stateless and scale
#   horizontally with request and SSE subscriber load.
# - The event poller, notification dispatcher, digest flusher, escalation
#   stepper, and retention pruners are gated by a single PostgreSQL session
#   advisory lock (0x534F4245434F4E in internal/lease). Running multiple
#   background workers does not increase ingestion or rule-evaluation
#   throughput; only the single lease holder evaluates events, while one standby
#   replica provides sub-3-second failover on node drain or rollout.
#
# Set worker.enabled=true below in multi-replica / HA deployments so API pods
# run with WORKLOAD_ROLE=api (never contending for the leader lease) and a
# dedicated worker Deployment manages background evaluation and lease failover.
replicaCount: 1

# Minimum seconds a newly ready pod must stay ready without crashing before
# Kubernetes treats it as available during a RollingUpdate.
minReadySeconds: 5

# Kubernetes pod termination grace period in seconds. Must be strictly greater
# than config.shutdownGracePeriod (30s) plus the HTTP server drain timeout (10s)
# and advisory-lock release timeout (5s) so in-flight webhook/email deliveries
# and open /alerts/stream SSE connections finish cleanly instead of being
# SIGKILLed mid-flight.
terminationGracePeriodSeconds: 60

image:
  # Container image repository.
  repository: ghcr.io/sorotrail/sorobeacon
  pullPolicy: IfNotPresent
  # Overrides the image tag. Defaults to the chart's appVersion.
  tag: ""

# Secrets for pulling images from private registries.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Create a dedicated ServiceAccount for the pod. SoroBeacon needs no
  # Kubernetes API access, so this exists only to keep the pod off the
  # namespace's default ServiceAccount.
  create: true
  annotations: {}
  # Use an existing ServiceAccount instead of creating one.
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  # The image's own user is non-root (UID/GID 10001); pinning numeric IDs keeps
  # the pod stable even if the image's USER directive changes and lets kubelet
  # enforce runAsNonRoot without resolving a username.
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # The binary writes nothing to disk — configuration is environment
  # variables, templates and migrations are embedded, and alerts live in
  # Postgres. A bounded emptyDir is mounted at /tmp for ephemeral scratch
  # space while the root filesystem stays read-only.
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 80
  # Container port. Must match config.httpAddr below (the app's HTTP_ADDR).
  targetPort: 8080

# CPU/memory requests and limits for the API (or combined) Deployment.
# Sizing basis:
# - Base resident footprint (Go runtime + pgx pool + embedded templates/migrations): ~35 MiB.
# - Each active /alerts/stream SSE subscriber and concurrent HTTP/GraphQL query
#   allocates bounded request/response buffers (HTTP_MAX_BODY_BYTES = 1 MiB);
#   128Mi request / 256Mi limit accommodates ~500 concurrent SSE clients and
#   burst read queries with >2x headroom.
# - 100m CPU request guarantees scheduling share for TLS handshakes and JSON/HTML
#   serialization; 500m limit bounds bursts during large CSV/NDJSON exports.
# ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Opt-in pod anti-affinity to spread API replicas across failure domains.
# Off by default so multi-replica test renders and single-node clusters (Kind,
# Minikube) never leave pods unschedulable.
podAntiAffinity:
  enabled: false
  # "soft" (preferredDuringSchedulingIgnoredDuringExecution) or
  # "hard" (requiredDuringSchedulingIgnoredDuringExecution).
  type: "soft"
  topologyKey: "kubernetes.io/hostname"

# HorizontalPodAutoscaler for the stateless API Deployment.
# Off by default so the chart never assumes metrics-server or a custom metrics
# adapter is installed in the cluster.
#
# Signal choice for an I/O-bound API:
# SoroBeacon's API spends most of its wall time waiting on PostgreSQL queries
# and holding open /alerts/stream SSE connections. Waiting goroutines consume
# memory (stack + per-request / per-subscriber buffers) rather than CPU, so
# memory utilization (75% default) is paired with CPU (80%) as the built-in
# signal, and customMetrics allows plugging in Pod-level request/stream metrics
# (e.g. sorobeacon_http_requests_per_second via Prometheus Adapter) when
# available. Never autoscale the worker Deployment: polling is singleton-gated
# by the Postgres advisory lock.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetMemoryUtilizationPercentage: 75
  targetCPUUtilizationPercentage: 80
  # Optional autoscaling/v2 MetricSpec entries (e.g. Pods custom metrics).
  customMetrics: []
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0

# PodDisruptionBudget for the API Deployment.
# When enabled on a single-replica deployment (replicaCount=1 and autoscaling
# off), the template automatically renders maxUnavailable: 1 rather than
# minAvailable: 1 so node drains (kubectl drain) are never blocked. When
# effective replicas >= 2, it defaults to minAvailable: 1.
podDisruptionBudget:
  enabled: false
  minAvailable: null
  maxUnavailable: null

# Dedicated background worker Deployment (poller, notification dispatcher,
# digest flusher, escalation stepper, retention pruners, and heartbeat).
#
# Lease constraint:
# SoroBeacon elects a single active leader using a PostgreSQL session advisory
# lock (0x534F4245434F4E in internal/lease). Only the leader pod runs the
# ingest and delivery loops. Setting worker.enabled=true separates the
# background worker into its own Deployment (WORKLOAD_ROLE=worker) and switches
# the main Deployment to API-only mode (WORKLOAD_ROLE=api) so scaling API pods
# does not create idle advisory-lock contenders.
# - worker.replicaCount: 1 runs a single active worker (pod restart recovery via kubelet).
# - worker.replicaCount: 2 runs 1 active leader + 1 warm standby follower that
#   promotes within lease.DefaultInterval (3s) when the leader pod drains.
# - Setting worker.replicaCount > 2 adds no throughput and only increases
#   advisory-lock polling against PostgreSQL.
worker:
  enabled: false
  replicaCount: 1
  minReadySeconds: 5
  terminationGracePeriodSeconds: 60
  podAnnotations: {}
  # Sizing basis for the background worker:
  # - Evaluates rules across up to 1,000 events per poll batch and dispatches
  #   outbound webhooks/emails with bounded in-memory state windows.
  # - 100m CPU / 128Mi RAM request and 500m CPU / 256Mi RAM limit cover steady
  #   multi-network polling and alert bursts without OOM risk.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinity:
    enabled: false
    type: "soft"
    topologyKey: "kubernetes.io/hostname"
  # Worker PodDisruptionBudget.
  # Drain safety: when worker.replicaCount is 1, the template always enforces
  # maxUnavailable: 1 (even if minAvailable is set) because a PDB requiring 1
  # available pod on a 1-replica worker blocks node drains indefinitely. When
  # worker.replicaCount >= 2 (active + warm standby), it defaults to
  # minAvailable: 1 so one worker stays online to hold the lease during drains.
  podDisruptionBudget:
    enabled: false
    minAvailable: null
    maxUnavailable: null

# ── Application configuration (ConfigMap) ────────────────────────────────────
#
# Non-secret environment variables. These land in a ConfigMap that the pod
# consumes with envFrom, so the whole effective configuration is visible in
# `kubectl describe configmap` instead of being buried in a deployment spec.
#
config:
  # Optional path to a config file read at startup. Environment variables
  # always win; the file is only a fallback for values left unset. Empty
  # disables it. Pointing this at a path only helps if something mounts a
  # file there — a ConfigMap or Secret volume — since the chart does not
  # create one.
  configFile: ""
  # Which Stellar network to monitor: testnet | mainnet | futurenet | custom.
  # A network's passphrase is its identity, and SoroBeacon verifies at startup
  # that the RPC endpoint belongs to the configured network, refusing to start
  # on a mismatch — so a mainnet endpoint behind testnet config fails fast
  # rather than silently evaluating rules against the wrong chain.
  network: "testnet"
  # Stellar RPC endpoint (JSON-RPC 2.0). Defaults to the testnet preset; for
  # mainnet point this at a provider URL, since public mainnet nodes are
  # rate-limited.
  rpcUrl: "https://soroban-testnet.stellar.org"
  # Network passphrase. Required with network: custom, optional override
  # otherwise. Empty means "use the preset for `network`".
  networkPassphrase: ""
  # Where events come from: rpc (poll a Stellar RPC node directly) or
  # sorotrail (read a SoroTrail indexer, which retains events past the RPC's
  # ~1-7 day window and can be shared by several SoroBeacon instances).
  sourceMode: "rpc"
  # SoroTrail indexer base URL. Required when sourceMode is sorotrail.
  sorotrailUrl: ""
  # Horizon REST base URL. Required when sourceMode is horizon, which reads
  # events from Horizon's transaction history rather than the RPC.
  horizonUrl: ""
  # Serve the interactive GraphQL playground at /graphql/playground. Off by
  # default: the endpoint itself is always available, and the playground is
  # an extra surface you probably do not want on a public deployment.
  graphqlPlayground: false
  # Query depth and complexity ceilings for the GraphQL endpoint. Empty keeps
  # the application's defaults.
  graphqlMaxDepth: ""
  graphqlMaxComplexity: ""
  graphqlAllowlistOnly: false
  # Stable identity for this deployment, stamped as the origin on federated
  # alerts. Must be unique across instances that federate with each other.
  # Empty is fine for a standalone instance, but creating a federation channel
  # then fails with an actionable error; the process still starts.
  instanceName: ""
  # API + dashboard listen address. Must match service.targetPort.
  httpAddr: ":8080"
  # Maximum request body size for API write endpoints (POST/PATCH/PUT), in
  # bytes. GET/HEAD/OPTIONS are not limited.
  httpMaxBodyBytes: 1048576
  # How often the poller calls getEvents (minimum 1s).
  pollInterval: "5s"
  # Minimum slog level: debug | info | warn | error. Logs are JSON on stdout.
  logLevel: "info"
  # How long since a monitor's last match before the dashboard marks it
  # silent.
  monitorSilentAfter: "24h"
  # How long to wait for in-flight alert deliveries to finish once the
  # process is asked to stop, before they are persisted as retries.
  shutdownGracePeriod: "30s"
  # Dampen repeated alert episodes; defaults match internal/config.
  flappingEpisodes: 3
  flappingWindow: "15m"
  flappingQuietAfter: "2m"
  # Ledger lag at which /readyz fails. 0 disables the check, so a lagging
  # poller cannot take itself out of a load balancer without opting in.
  readyzLagThreshold: 0
  # External dead-man's switch: while ingest is demonstrably healthy the leader
  # pings this URL, so an external service notices when the pings stop. The URL
  # is a credential — its path identifies the monitor — so the application
  # never logs it or echoes it in an error message. Empty turns the heartbeat
  # off.
  heartbeatUrl: ""
  # How often a healthy instance pings (Go duration). Must be longer than
  # pollInterval: a ping goes out only after a new successful poll, so an
  # interval at or below the poll cycle would read as no progress and the
  # application rejects it at startup.
  heartbeatInterval: "1m"
  # Optional failure ping, once per outage, sent to heartbeatUrl plus this
  # suffix (the convention is "/fail"). Requires heartbeatUrl; empty means
  # success pings only, and the external service notices the silence itself.
  heartbeatFailureSuffix: ""
  # Consecutive permanent channel failures (401/403/404) after which a
  # channel is taken out of rotation. 0 never auto-disables, which is the
  # behaviour every release before channel health had.
  channelDisableAfterFailures: 0
  # NETWORKS: comma-separated chains this instance polls, primary first. Empty
  # means the single chain NETWORK names, which is how every deployment before
  # multi-network polling behaves. Per-network endpoints are set through
  # NETWORKS_<NAME>_RPC_URL in extraEnv.
  networks: ""
  # Per-client API token-bucket refill rate. 0 disables the limiter. Health
  # and readiness probes are always exempt.
  rateLimitRps: 0
  # Per-client bucket size. 0 means "derive it from rateLimitRps".
  rateLimitBurst: 0
  # Key clients by X-Forwarded-For instead of the socket address. Only enable
  # behind a proxy that overwrites the header, or a spoofed value defeats the
  # limiter.
  rateLimitTrustForwarded: false
  # Comma-separated browser Origins allowed to call the API cross-origin.
  # Empty disables CORS; the dashboard is same-origin and never needs it.
  corsAllowedOrigins: ""
  # How long to keep alerts (and their cascaded delivery attempts), e.g. 90d
  # or 24h. Empty keeps history forever, so an upgrade never starts deleting
  # anything by accident.
  alertRetention: ""
  # How long to keep audit log entries, e.g. 90d or 24h. Empty keeps audit
  # history forever.
  auditRetention: ""
  # Comma-separated RPC endpoints to fail over between. Empty uses rpcUrl
  # alone. The first entry is the primary.
  rpcUrls: ""
  # gRPC listen address, e.g. ":9090". Empty disables the gRPC server.
  grpcAddr: ""
  # How many recent ledgers to track for reorg detection, and how deep a
  # ledger must be buried before it is treated as final. Empty keeps the
  # application's own defaults.
  reorgTrackingWindow: ""
  reorgConfirmationDepth: ""
  # Optional HTTP endpoint called to enrich an alert before delivery, with its
  # per-call timeout and how long a response is cached. Empty disables
  # enrichment entirely.
  alertEnrichmentUrl: ""
  alertEnrichmentTimeout: ""
  alertEnrichmentCacheTtl: ""
  # Where pruned alerts are archived before deletion: a directory path,
  # file://, dir:// or s3://. Empty means archiving is off and retention
  # simply deletes.
  archiveUrl: ""
  # Per-channel-type delivery rate limits, in requests per second. Empty
  # keeps the application's defaults; the provider-specific keys override the
  # default for that transport only.
  notifyRateLimitDefaultRps: ""
  notifyRateLimitSlackRps: ""
  notifyRateLimitTelegramRps: ""
  notifyRateLimitPagerdutyRps: ""
  # OpenTelemetry tracing. Empty endpoint disables tracing, so nothing is
  # exported unless a collector is configured.
  otlpEndpoint: ""
  otlpServiceName: ""
  otlpSampleRate: ""

# ── Database ─────────────────────────────────────────────────────────────────
#
# SoroBeacon requires an EXTERNAL PostgreSQL instance. The chart deliberately
# does not bundle Postgres, so you keep control of backups, HA and upgrades.
# Recommended operators:
#   * CloudNativePG        https://cloudnative-pg.io
#   * Zalando Postgres     https://github.com/zalando/postgres-operator
#
# The connection string is a secret (it usually embeds a password), so it is
# never a plain ConfigMap entry: it comes from a Secret, either one this chart
# manages or one you already have.
database:
  # Name of an existing Secret holding the connection string. When set, the
  # chart references it and does not create its own. Use this when the
  # database credentials are managed outside the release (External Secrets,
  # Sealed Secrets, a manually created Secret).
  existingSecret: ""
  # Key within that Secret. Only used when existingSecret is set.
  existingSecretKey: "DATABASE_URL"
  # Inline connection string, stored in the chart-managed Secret. Ignored when
  # existingSecret is set. Required otherwise.
  url: ""
  # Optional read-only replica connection string, used for read-heavy API
  # queries. It embeds a password like the primary, so it lives in the same
  # Secret and never in the ConfigMap. Empty sends every read to the primary.
  replicaUrl: ""
  # pgx pool tuning. 0 (and an empty duration) keeps the driver default, so a
  # small node can lower maxConns without a code change and a busy instance
  # behind PgBouncer can raise it. maxConns must not be below minConns.
  maxConns: 0
  minConns: 0
  # Go durations, e.g. 1h / 30m.
  maxConnLifetime: ""
  maxConnIdleTime: ""
  # Startup connection retry. A managed database that is restarting or
  # failing over refuses connections for a while; the store retries rather
  # than turning that pause into an outage. connectAttempts counts the first
  # try (1-100), and connectDelay is the base delay, doubled after every
  # failure with jitter. Empty keeps the application defaults (5 and 2s).
  connectAttempts: 5
  connectDelay: "2s"
  # Optional PostgreSQL TLS / mTLS settings (DATABASE_SSL_*).
  sslMode: ""
  sslCertFile: ""
  sslKeyFile: ""
  sslRootCertFile: ""
  # Optional Secret mounted read-only at /etc/sorobeacon/tls/database.
  tlsSecretName: ""

# ── Credentials (Secret) ─────────────────────────────────────────────────────
auth:
  # API_TOKEN: static bearer token(s) for /api/v1 and the dashboard sign-in,
  # comma-separated so a token can be rotated without downtime. Empty leaves
  # the API and dashboard open, which is how the docker-compose quickstart
  # works — set it on anything reachable beyond a trusted network.
  apiToken: ""
  # CONFIG_ENCRYPTION_KEY: base64 AES-GCM key that encrypts channel config at
  # rest. Channel config holds webhook URLs, bot tokens and SMTP credentials,
  # so this is the key that protects them; losing it makes the encrypted rows
  # unrecoverable, so back it up with the database. Generate with
  # `openssl rand -base64 32`.
  configEncryptionKey: ""
  # WORKSPACE_TOKENS: comma-separated workspace=token bindings, which is what
  # makes one instance multi-tenant. A credential decides which workspace a
  # request acts on, so these are credentials and live in the Secret with
  # apiToken. Empty leaves the instance single-tenant on the default workspace.
  workspaceTokens: ""
  # Name of an existing Secret holding the two values above, so they can be
  # managed outside the release. When set, apiToken/configEncryptionKey are
  # ignored.
  existingSecret: ""
  # Keys within that Secret. Only used when existingSecret is set.
  apiTokenKey: "API_TOKEN"
  configEncryptionKeyKey: "CONFIG_ENCRYPTION_KEY"

# ── Secret backend ───────────────────────────────────────────────────────────
#
# Where channel credentials are resolved from. The default reads them from the
# encrypted database column; "vault" fetches them from HashiCorp Vault at
# delivery time instead.
secrets:
  # env, vault, or file.
  provider: ""
  # How long a resolved secret is cached before it is fetched again.
  cacheTtl: ""
  # Vault address and namespace. Only used when provider is vault.
  vaultAddr: ""
  vaultNamespace: ""
  # VAULT_TOKEN is a credential, so it is stored in the same Secret as the
  # other credentials and never in the ConfigMap. Empty leaves it unset.
  vaultToken: ""

# ── Migrations ───────────────────────────────────────────────────────────────
#
# SoroBeacon applies its embedded migrations itself, during startup and before
# it binds the HTTP listener, so a pod cannot serve traffic on a stale schema
# even with this hook disabled. Concurrent replicas are serialised by
# golang-migrate's Postgres advisory lock.
#
# Enabling the hook adds a pre-install/pre-upgrade Job that runs the same
# migration path once, before the Deployment is rolled. A broken migration then
# fails the release while the previous version is still serving, instead of
# crash-looping the new pods. It is off by default because the in-pod migration
# already runs before traffic, and the hook costs an extra short-lived pod per
# release. See deploy/helm/sorobeacon/README.md for the full rationale.
migrations:
  enabled: false
  # How many times the hook pod is retried before the release fails. Each
  # attempt retries the database wait itself, so this can stay small.
  backoffLimit: 3
  # Upper bound on the hook, in seconds. Must stay below Helm's
  # --timeout (default 5m) or the release times out before the Job does.
  activeDeadlineSeconds: 300

# Single sign-on. With oidc.issuer empty (the default) SSO is off and the
# dashboard uses its token form exactly as before. clientSecret is a credential
# and is rendered into the auth Secret, never the ConfigMap.
oidc:
  issuer: ""
  clientID: ""
  clientSecret: ""
  redirectURL: ""
  # Space-separated extra scopes; the provider's openid/profile/email are
  # requested regardless.
  scopes: ""
  # Comma-separated e-mail domains allowed to sign in. Empty allows any account
  # the provider authenticates, which is only safe on a single-tenant issuer.
  allowedDomains: ""
  # The workspace an SSO user lands in. Empty means the default workspace.
  workspace: ""
  # Claim naming the user's workspace, for an issuer that carries one. Empty
  # puts every SSO user in oidc.workspace.
  workspaceClaim: ""
  # Claim naming the user's role (viewer, editor or admin), for an issuer that
  # carries one. Empty makes every SSO user an admin.
  roleClaim: ""
  # Claim naming the user's group memberships, and mappings from provider
  # groups to SoroBeacon roles/workspaces.
  groupClaim: ""
  groupMappings: ""
  groupCacheTTL: ""
  # How long a started login may take to come back.
  loginStateTTL: "10m"

# ── Mutual TLS (mTLS) and component TLS ─────────────────────────────────────
tls:
  # Optional Secret mounted read-only at /etc/sorobeacon/tls/server.
  secretName: ""
  # Server TLS certificate, private key, client CA bundle, client auth mode
  # (none | request | require), and client-cert subject -> workspace[:role] map.
  certFile: ""
  keyFile: ""
  clientCAFile: ""
  clientAuth: ""
  principalMap: ""
  # Optional Secret mounted read-only at /etc/sorobeacon/tls/sorotrail for
  # outbound mTLS to an upstream SoroTrail indexer.
  sorotrailSecretName: ""
  sorotrailCertFile: ""
  sorotrailKeyFile: ""
  sorotrailCAFile: ""
  sorotrailServerName: ""
